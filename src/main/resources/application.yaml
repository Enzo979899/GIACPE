spring:
  application:
    name: GIACPE

  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:giacpe}
    username: ${DB_USER:giacpe}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
